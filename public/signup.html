<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizTravex — Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#f7f2e9] min-h-screen flex items-center justify-center px-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl border border-stone-200 p-8">
        <div class="text-center mb-6">
            <img src="biztravex logo.png" alt="BizTravex Logo" class="w-12 h-12 mx-auto rounded object-cover shadow-sm mb-3">
            <h1 class="text-xl font-extrabold text-blue-950">BizTravex CRM</h1>
            <p class="text-stone-500 text-sm mt-1">Create your account</p>
        </div>
        <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-3 py-2 mb-4"></div>
        <div id="success-box" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-lg px-3 py-2 mb-4"></div>
        <form id="signup-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Name</label>
                <input type="text" id="signup-name" required class="w-full border border-stone-300 rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Email</label>
                <input type="email" id="signup-email" required class="w-full border border-stone-300 rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Password</label>
                <input type="password" id="signup-password" required minlength="8" class="w-full border border-stone-300 rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                <p class="text-xs text-stone-400 mt-1">Minimum 8 characters.</p>
            </div>
            <button type="submit" class="w-full py-2.5 bg-blue-600 text-white font-bold rounded-xl hover:shadow-lg hover:shadow-blue-500/40 transition-all">
                Create Account
            </button>
        </form>
        <p class="text-center text-sm text-stone-500 mt-5">
            Already have an account? <a href="/login.html" class="text-blue-600 font-semibold hover:underline">Sign in</a>
        </p>
    </div>
    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;

            const errorBox = document.getElementById('error-box');
            const successBox = document.getElementById('success-box');
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    successBox.textContent = 'Account created successfully. Redirecting to login...';
                    successBox.classList.remove('hidden');
                    setTimeout(() => { window.location.href = '/login.html'; }, 1500);
                } else {
                    errorBox.textContent = data.error || 'Sign up failed.';
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.textContent = 'Network error. Please try again.';
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
