<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizTravex Home Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* ── Inline expand panel ── */
        .expand-panel {
            display: none;
            border-top: 2px solid #3b82f6;
            background: #f8faff;
            border-radius: 0 0 12px 12px;
            animation: slideDown .18s ease-out;
        }

        .expand-panel.open {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Info grid cells ── */
        .info-cell .label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #94a3b8;
            font-family: 'Inter', monospace;
        }

        .info-cell .val {
            font-size: 13.5px;
            font-weight: 600;
            color: #1e293b;
            margin-top: 2px;
            word-break: break-word;
        }

        /* ── Update form ── */
        .upd-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: #64748b;
            margin-bottom: 4px;
            display: block;
        }

        .upd-input {
            width: 100%;
            padding: 8px 11px;
            border: 1.5px solid #e2e8f0;
            border-radius: 7px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            background: #ffffff;
            transition: border-color .15s;
        }

        .upd-input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        /* ── Audit log ── */
        .log-entry {
            border-left: 3px solid #fbbf24;
            padding-left: 10px;
        }

        /* ── Badge ── */
        .badge-upcoming {
            background: #fef9c3;
            color: #854d0e;
            border-color: #fde68a;
        }

        .badge-inprogress {
            background: #dbeafe;
            color: #1e40af;
            border-color: #bfdbfe;
        }

        .badge-completed {
            background: #dcfce7;
            color: #166534;
            border-color: #bbf7d0;
        }

        .badge-cancelled {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>

<nav class="bg-slate-900 text-white shadow-md mb-6">
    <div class="max-w-6xl mx-auto px-6 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-2">
            <span class="font-black tracking-wider text-sm uppercase text-slate-100">BizTravex</span>
        </div>
        <div class="flex flex-wrap items-center gap-1 sm:gap-3 text-xs font-bold tracking-wide uppercase">
            <a href="http://localhost:3000" id="nav-home" class="px-3 py-2 rounded-md bg-red-600 text-white shadow">Home
                Hub</a>
            <a href="http://localhost:4000/mis.html" id="nav-mis"
                class="px-3 py-2 rounded-md transition duration-150 hover:bg-slate-800 text-slate-300">MIS</a>
            <a href="http://localhost:4001/expense.html" id="nav-expense"
                class="px-3 py-2 rounded-md transition duration-150 hover:bg-slate-800 text-slate-300">Expenses</a>
            <a href="http://localhost:5000/attendance.html" id="nav-attendance"
                class="px-3 py-2 rounded-md transition duration-150 hover:bg-slate-800 text-slate-300">Attendance</a>
            <a href="http://localhost:6000/billing.html" id="nav-billing"
                class="px-3 py-2 rounded-md transition duration-150 hover:bg-slate-800 text-slate-300">Billing</a>
            <a href="http://localhost:7000/reports.html" id="nav-reporting"
                class="px-3 py-2 rounded-md transition duration-150 hover:bg-slate-800 text-slate-300">Reports</a>
            <a href="http://localhost:8000/settings.html" id="nav-settings"
                class="px-3 py-2 rounded-md transition duration-150 hover:bg-slate-800 text-slate-300">Settings</a>
        </div>
    </div>
</nav>

<body class="bg-gray-100 font-sans p-6 text-gray-800">

    <div class="max-w-6xl mx-auto">
        <header
            class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">Upload Files</h1>
                <p class="text-xs text-gray-500"></p>
                <button
                    class="mt-3 px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded hover:bg-blue-700 transition"
                    onclick="openManualModal()">
                    ＋ Add Manual Booking
                </button>
            </div>
            <div class="flex flex-wrap items-center gap-4">
                <div class="border p-2 rounded-lg bg-gray-50 flex items-center gap-2">
                    <span class="text-xs font-bold text-gray-600">Client Dump:</span>
                    <input type="file" id="upload-dump" accept=".xlsx,.xls"
                        class="text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <button onclick="processUpload('dump')"
                        class="px-3 py-1 bg-blue-600 text-white text-xs font-semibold rounded hover:bg-blue-700 transition">Import
                        Rows</button>
                </div>
                <div class="border p-2 rounded-lg bg-gray-50 flex items-center gap-2">
                    <span class="text-xs font-bold text-gray-600">Vendor file:</span>
                    <input type="file" id="upload-vendor" accept=".xlsx,.xls"
                        class="text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                    <button onclick="processUpload('vendor')"
                        class="px-3 py-1 bg-purple-600 text-white text-xs font-semibold rounded hover:bg-purple-700 transition">Import
                        Rows</button>
                </div>
            </div>
        </header>

        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-6">
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3">Filter Pipeline Parameters</h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3 mb-4 text-xs">
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" value="bookingId"
                        onchange="toggleFilterInputVisibility(this)" class="w-4 h-4 rounded text-blue-600"> Booking
                    ID</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" value="pickUpDate"
                        onchange="toggleFilterInputVisibility(this)" class="w-4 h-4 rounded text-blue-600"> Date</label>
            </div>
            <div id="active-inputs-bar" class="flex flex-wrap items-end gap-3 pt-3 border-t hidden">
                <div id="inputs-container" class="flex flex-wrap gap-3"></div>
                <button onclick="executeFilteredSearchPipeline()"
                    class="px-5 py-2 bg-gray-900 text-white text-xs font-bold rounded-lg hover:bg-black transition uppercase tracking-wider">Apply
                    Filters</button>
            </div>
        </section>

        <main>
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3">Matched Bookings</h3>
            <div id="widget-list-container" class="space-y-2">
                <div class="bg-white p-6 text-center text-sm text-gray-400 border rounded-xl shadow-sm">Select system
                    query variables or import spreadsheets to seed widget entries.</div>
            </div>
        </main>
    </div>

    <!-- MANUAL BOOKING MODAL -->
    <div id="manual-modal"
        class="fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 bg-gray-50 border-b flex justify-between items-center shrink-0">
                <h2 class="text-lg font-bold text-gray-900">＋ Add Manual Booking</h2>
                <button onclick="closeManualModal()"
                    class="text-gray-400 hover:text-gray-700 text-2xl font-bold">&times;</button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 text-xs space-y-4 custom-scrollbar">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">Booking
                            ID</label><input type="text" id="m-id" placeholder="BIZ-2025-XXXX"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500 bg-gray-50"></div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">Pick-Up
                            Date</label><input type="date" id="m-date"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">Pick-Up
                            Time</label><input type="time" id="m-time"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">Client
                            Name</label><input type="text" id="m-client" placeholder="e.g. Emirates Tours"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">Customer
                            Name</label><input type="text" id="m-passenger" placeholder="Passenger name"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">Mobile
                            Number</label><input type="text" id="m-mobile" placeholder="+971…"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">Flight
                            Number</label><input type="text" id="m-flight" placeholder="e.g. EK203"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">Vendor
                            Name</label><input type="text" id="m-vendor" placeholder="e.g. Al Futtaim Limo"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">No. of
                            Passengers</label><input type="number" id="m-pax" min="1" placeholder="1"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">No. of
                            Infants</label><input type="number" id="m-infants" min="0" placeholder="0"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">No. of
                            Babies</label><input type="number" id="m-babies" min="0" placeholder="0"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">No. of
                            Luggages</label><input type="number" id="m-luggage" min="0" placeholder="0"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                </div>
                <div class="space-y-4">
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">Pickup
                            Address</label><input type="text" id="m-pickup" placeholder="Full pickup address"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">Drop
                            Address</label><input type="text" id="m-drop" placeholder="Full drop address"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">Service Type</label>
                        <select id="m-service"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500 bg-white">
                            <option>Chauffeur Service</option>
                            <option>Pickup</option>
                            <option>Drop</option>
                        </select>
                    </div>
                    <div><label class="block font-bold mb-1 text-gray-600 uppercase tracking-tight">Car
                            Type</label><input type="text" id="m-car" placeholder="e.g. Lexus ES350"
                            class="w-full border rounded-lg px-3 py-2 focus:outline-blue-500"></div>
                </div>
            </div>
            <div class="px-6 py-4 bg-gray-50 border-t flex justify-end gap-3 shrink-0">
                <button onclick="closeManualModal()"
                    class="px-5 py-2 border border-gray-300 rounded-lg text-xs font-bold text-gray-700 bg-white hover:bg-gray-100 transition">Cancel</button>
                <button onclick="saveManualBooking()"
                    class="px-5 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700 transition">＋
                    Create Booking</button>
            </div>
        </div>
    </div>

    <script>
        let liveLoadedWidgetsDataset = [];
        let currentOpenIndex = null; // tracks which row is expanded

        // ── Attribute options for the update dropdown ──────────────────────────
        const UPDATABLE_FIELDS = [
            { value: 'status', label: 'Status' },
            { value: 'chauffeurName', label: 'Chauffeur Name' },
            { value: 'chauffeurPhone', label: 'Chauffeur Phone' },
            { value: 'carNumber', label: 'Car Plate Number' },
            { value: 'vendorName', label: 'Vendor Name' },
            { value: 'pickUpDate', label: 'Pickup Date' },
            { value: 'pickUpTime', label: 'Pickup Time' },
            { value: 'pickupAddress', label: 'Pickup Address' },
            { value: 'dropAddress', label: 'Drop Address' },
            { value: 'flightNumber', label: 'Flight Number' },
            { value: 'carType', label: 'Car Type' },
            { value: 'serviceType', label: 'Service Type' },
            { value: 'noOfPassengers', label: 'No. of Passengers' },
            { value: 'noOfInfants', label: 'No. of Infants' },
            { value: 'noOfBaby', label: 'No. of Babies' },
            { value: 'noOfLuggages', label: 'No. of Luggages' },
            { value: 'amountAED', label: 'Amount (AED)' },
            { value: 'customerName', label: 'Customer Name' },
            { value: 'customerMobile', label: 'Customer Mobile' },
            { value: 'startKm', label: 'Start Km.' },
            { value: 'endKm', label: 'End Km.' },

        ];

        // ── Filter helpers ──────────────────────────────────────────────────────
        function toggleFilterInputVisibility(checkbox) {
            const container = document.getElementById('inputs-container');
            const targetFieldId = `filter-input-wrap-${checkbox.value}`;
            if (checkbox.checked) {
                const wrap = document.createElement('div');
                wrap.id = targetFieldId;
                wrap.className = 'flex flex-col text-xs';
                let labelText = checkbox.parentElement.innerText.trim();
                let inputHtml = checkbox.value === 'pickUpDate'
                    ? `<input type="date" id="param-${checkbox.value}" value="${new Date().toISOString().split('T')[0]}" class="border rounded-lg px-3 py-2 focus:outline-blue-500">`
                    : `<input type="text" id="param-${checkbox.value}" placeholder="Enter search criteria..." class="border rounded-lg px-3 py-2 focus:outline-blue-500">`;
                wrap.innerHTML = `<label class="font-bold text-gray-600 mb-1 uppercase tracking-tight">${labelText}</label>${inputHtml}`;
                container.appendChild(wrap);
            } else {
                const el = document.getElementById(targetFieldId);
                if (el) el.remove();
            }
            document.getElementById('active-inputs-bar').classList.toggle('hidden', container.children.length === 0);
        }

        async function executeFilteredSearchPipeline() {
            const checkedBoxes = document.querySelectorAll('input[type="checkbox"]:checked');
            let searchPayload = {};
            checkedBoxes.forEach(box => {
                const inputEl = document.getElementById(`param-${box.value}`);
                if (inputEl && inputEl.value) searchPayload[box.value] = inputEl.value;
            });
            try {
                const res = await fetch('/api/bookings/filter', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filters: searchPayload })
                });
                liveLoadedWidgetsDataset = await res.json();
                currentOpenIndex = null;
                renderWidgets();
            } catch (e) { alert('Failed to complete filter aggregation query loop.'); }
        }

        // ── Render booking rows ─────────────────────────────────────────────────
        function renderWidgets() {
            const container = document.getElementById('widget-list-container');
            if (liveLoadedWidgetsDataset.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 text-center text-sm text-gray-400 border rounded-xl shadow-sm">No operational rows matched selected database parameters.</div>`;
                return;
            }

            const fieldOptions = UPDATABLE_FIELDS.map(f => `<option value="${f.value}">${f.label}</option>`).join('');

            container.innerHTML = liveLoadedWidgetsDataset.map((row, idx) => {
                const statusClass =
                    row.status === 'Ride In Progress' ? 'badge-inprogress' :
                        row.status === 'Completed' ? 'badge-completed' :
                            row.status === 'Cancelled' ? 'badge-cancelled' : 'badge-upcoming';

                // Build info cells — visible fields only
                const hiddenFields = ['_id', '__v', 'createdAt', 'updatedAt', 'updates', 'startKm', 'remarks', 'pickUpZipcode', 'pickUpRegion', 'pickUpCountry', 'endKm', 'dropRegion', 'dropCountry', 'dropZipcode', 'distanceTravelledByCar', 'customerMobile',];
                const infoCells = Object.keys(row)
                    .filter(k => !hiddenFields.includes(k))
                    .map(k => {
                        let v = row[k];
                        if (v === undefined || v === null || v === '') v = '—';
                        if (typeof v === 'object') v = JSON.stringify(v);
                        const niceLabel = k.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
                        return `<div class="info-cell bg-white rounded-lg p-3 border border-slate-100 shadow-sm">
                            <div class="label">${niceLabel}</div>
                            <div class="val">${v}</div>
                        </div>`;
                    }).join('');

                return `
                <div class="rounded-xl overflow-hidden border border-gray-200 shadow-sm" id="row-wrap-${idx}">
                    <!-- Summary row -->
                    <div class="bg-white px-4 py-3 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 hover:border-blue-400 transition group" id="row-header-${idx}">
                        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-4 flex-1 text-xs">
                            <div>
                                <p class="text-[10px] uppercase font-bold text-gray-400">Booking ID</p>
                                <p class="font-mono font-bold text-gray-900">${row.bookingId || '—'}</p>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase font-bold text-gray-400">Date &amp; Time</p>
                                <p class="text-gray-700 font-medium">${row.pickUpDate || '—'} <span class="text-gray-400">${row.pickUpTime || ''}</span></p>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase font-bold text-gray-400">Client</p>
                                <p class="text-gray-700 font-semibold">${row.clientName || '—'}</p>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase font-bold text-gray-400">Customer</p>
                                <p class="text-gray-700 font-medium">${row.customerName || '—'}</p>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase font-bold text-gray-400">Status</p>
                                <span class="inline-block mt-0.5 px-2.5 py-0.5 text-[10px] font-semibold border rounded-full ${statusClass}">${row.status || 'Upcoming'}</span>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase font-bold text-gray-400">Chauffeur</p>
                                <p class="text-gray-700 font-medium">${row.chauffeurName || '—'}</p>
                            </div>
                        </div>
                        <button onclick="toggleExpand(${idx})" id="expand-btn-${idx}"
                            class="px-4 py-2 border border-gray-300 rounded-lg text-xs font-bold bg-gray-50 hover:bg-blue-600 hover:text-white hover:border-blue-600 shadow-sm transition whitespace-nowrap">
                            View Full Info
                        </button>
                    </div>

                    <!-- Inline expand panel -->
                    <div class="expand-panel" id="expand-panel-${idx}">
                        <div class="p-5 grid grid-cols-1 xl:grid-cols-3 gap-5">

                            <!-- LEFT: Info + Update form -->
                            <div class="xl:col-span-2 space-y-5">

                                <!-- Booking info grid -->
                                <div>
                                    <h3 class="text-[11px] font-bold uppercase tracking-widest text-blue-600 mb-3 flex items-center gap-2">
                                        <span class="inline-block w-2 h-2 rounded-full bg-blue-600"></span>
                                        Booking Information
                                    </h3>
                                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                                        ${infoCells}
                                    </div>
                                </div>

                                <!-- Update form -->
                                <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
                                    <h3 class="text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-4 flex items-center gap-2">
                                        <span class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
                                        Update a Field
                                    </h3>

                                    <div class="space-y-4">

                                        <!-- Row 1: Attribute selector + new value -->
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-end">
                                            <div>
                                                <label class="upd-label">Select Attribute</label>
                                                <select id="upd-field-${idx}" class="upd-input">
                                                    <option value="">— Choose field —</option>
                                                    ${fieldOptions}
                                                </select>
                                            </div>
                                            <div>
                                                <label class="upd-label">New Value</label>
                                                <input type="text" id="upd-value-${idx}" placeholder="Enter new value…" class="upd-input">
                                            </div>
                                        </div>

                                        <!-- Row 2: Remarks -->
                                        <div>
                                            <label class="upd-label">Remarks <span class="text-red-500">*</span></label>
                                            <input type="text" id="upd-remarks-${idx}" placeholder="Reason or context for this change…" class="upd-input" required>
                                        </div>

                                        <!-- Row 3: Author -->
                                        <div>
                                            <label class="upd-label">Author / Updated By <span class="text-red-500">*</span></label>
                                            <input type="text" id="upd-author-${idx}" placeholder="Your name or initials…" class="upd-input" required>
                                        </div>

                                        <div class="flex justify-end pt-1">
                                            <button onclick="submitFieldUpdate(${idx}, '${row._id}', '${row.bookingId}')"
                                                class="px-5 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700 transition shadow-sm uppercase tracking-wide">
                                                Save Update &amp; Log
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- RIGHT: Audit trail -->
                            <div class="bg-slate-50 rounded-xl border border-slate-200 p-4 flex flex-col">
                                <h3 class="text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-3 border-b border-slate-200 pb-2 flex items-center gap-2">
                                    <span class="inline-block w-2 h-2 rounded-full bg-green-500"></span>
                                    Audit Trail
                                </h3>
                                <div id="audit-log-${idx}" class="space-y-3 flex-1 overflow-y-auto pr-1 text-xs custom-scrollbar max-h-96">
                                    <p class="text-gray-400 italic text-center py-6">Loading audit logs…</p>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // ── Toggle expand/collapse ──────────────────────────────────────────────
        async function toggleExpand(idx) {
            const panel = document.getElementById(`expand-panel-${idx}`);
            const btn = document.getElementById(`expand-btn-${idx}`);
            const isOpen = panel.classList.contains('open');

            // Close any currently open panel
            if (currentOpenIndex !== null && currentOpenIndex !== idx) {
                const prev = document.getElementById(`expand-panel-${currentOpenIndex}`);
                const prevBtn = document.getElementById(`expand-btn-${currentOpenIndex}`);
                if (prev) prev.classList.remove('open');
                if (prevBtn) prevBtn.textContent = 'View Full Info';
            }

            if (isOpen) {
                panel.classList.remove('open');
                btn.textContent = 'View Full Info';
                currentOpenIndex = null;
            } else {
                panel.classList.add('open');
                btn.textContent = 'Close Info';
                currentOpenIndex = idx;
                // Load audit logs
                const doc = liveLoadedWidgetsDataset[idx];
                await loadAuditLog(idx, doc.bookingId);
            }
        }

        // ── Load audit logs for a row ───────────────────────────────────────────
        async function loadAuditLog(idx, bookingId) {
            const container = document.getElementById(`audit-log-${idx}`);
            container.innerHTML = '<p class="text-gray-400 italic text-center py-6">Querying audit history…</p>';
            try {
                const res = await fetch(`/api/bookings/logs/${bookingId}`);
                const history = await res.json();
                if (history.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 italic text-center py-6">No audit records found.</p>';
                    return;
                }
                container.innerHTML = history.map(log => {
                    const ts = new Date(log.timestamp).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    const changes = Object.keys(log.changesMade || {}).map(field => `
                        <div class="mt-1.5 pl-3 log-entry text-[11px]">
                            <span class="font-mono text-slate-500 font-semibold">${field}:</span>
                            <span class="text-red-500 line-through mx-1">${log.changesMade[field].old}</span>
                            <span class="text-slate-400 mx-1">→</span>
                            <span class="text-emerald-600 font-bold">${log.changesMade[field].new}</span>
                        </div>`).join('');
                    const remarkTxt = log.description || log.remarks || '';
                    return `
                        <div class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm space-y-1">
                            <div class="flex justify-between items-start">
                                <span class="text-[10px] text-gray-400 font-medium">${ts}</span>
                                <span class="bg-slate-100 px-1.5 py-0.5 rounded text-[10px] font-bold text-slate-600">${log.updatedBy || log.author || ''}</span>
                            </div>
                            <p class="font-bold text-gray-800 text-[12px]">${log.action || 'Field Update'}</p>
                            ${remarkTxt ? `<p class="text-[11px] text-slate-500 italic">"${remarkTxt}"</p>` : ''}
                            ${changes}
                        </div>`;
                }).join('');
            } catch (e) {
                container.innerHTML = '<p class="text-red-500 italic text-center py-6">Failed to load audit data.</p>';
            }
        }

        // ── Submit single-field update ──────────────────────────────────────────
        async function submitFieldUpdate(idx, docId, bookingId) {
            const field = document.getElementById(`upd-field-${idx}`).value;
            const value = document.getElementById(`upd-value-${idx}`).value.trim();
            const remarks = document.getElementById(`upd-remarks-${idx}`).value.trim();
            const author = document.getElementById(`upd-author-${idx}`).value.trim();

            if (!field) { alert('Please select an attribute to update.'); return; }
            if (!value) { alert('Please enter a new value.'); return; }
            if (!remarks) { alert('Remarks are required.'); return; }
            if (!author) { alert('Author / Updated By is required.'); return; }

            try {
                const res = await fetch('/api/bookings/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: docId,
                        field: field,
                        newValue: value,
                        description: remarks,
                        userSignature: author
                    })
                });

                if (res.ok) {
                    // Clear inputs
                    document.getElementById(`upd-field-${idx}`).value = '';
                    document.getElementById(`upd-value-${idx}`).value = '';
                    document.getElementById(`upd-remarks-${idx}`).value = '';
                    document.getElementById(`upd-author-${idx}`).value = '';

                    // Update local dataset so info grid refreshes correctly
                    const doc = liveLoadedWidgetsDataset[idx];
                    const oldVal = doc[field];
                    doc[field] = value;
                    liveLoadedWidgetsDataset[idx] = doc;

                    // Refresh audit log
                    await loadAuditLog(idx, bookingId);

                    // Show inline success message briefly
                    const btn = document.querySelector(`#expand-panel-${idx} button[onclick^="submitFieldUpdate"]`);
                    const orig = btn.textContent;
                    btn.textContent = 'Saved!';
                    btn.classList.replace('bg-blue-600', 'bg-emerald-600');
                    setTimeout(() => { btn.textContent = orig; btn.classList.replace('bg-emerald-600', 'bg-blue-600'); }, 2000);
                } else {
                    const err = await res.json().catch(() => ({}));
                    alert('Update failed: ' + (err.message || 'Unknown error'));
                }
            } catch (err) {
                alert('Network error. Could not save update.');
            }
        }

        // ── File uploads ────────────────────────────────────────────────────────
        async function processUpload(type) {
            const input = document.getElementById(`upload-${type}`);
            if (input.files.length === 0) return alert('Select an excel spreadsheet file first.');
            const formData = new FormData();
            formData.append('file', input.files[0]);
            const endpoint = type === 'dump' ? '/api/bookings/upload-dump' : '/api/bookings/upload-vendor';
            try {
                const response = await fetch(endpoint, { method: 'POST', body: formData });
                if (response.ok) {
                    const res = await response.json();
                    alert(res.message);
                    input.value = '';
                    if (liveLoadedWidgetsDataset.length > 0) executeFilteredSearchPipeline();
                }
            } catch (e) { alert('File processing loop failed.'); }
        }

        // ── Manual Booking Modal ────────────────────────────────────────────────
        function openManualModal() {
            document.getElementById('m-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('manual-modal').classList.remove('hidden');
        }
        function closeManualModal() {
            document.getElementById('manual-modal').classList.add('hidden');
        }

        async function saveManualBooking() {
            const payload = {
                bookingId: document.getElementById('m-id').value,
                pickUpDate: document.getElementById('m-date').value,
                pickUpTime: document.getElementById('m-time').value,
                clientName: document.getElementById('m-client').value,
                customerName: document.getElementById('m-passenger').value,
                customerMobile: document.getElementById('m-mobile').value,
                flightNumber: document.getElementById('m-flight').value,
                vendorName: document.getElementById('m-vendor').value,
                noOfPassengers: document.getElementById('m-pax').value,
                noOfInfants: document.getElementById('m-infants').value,
                noOfBaby: document.getElementById('m-babies').value,
                noOfLuggages: document.getElementById('m-luggage').value,
                pickupAddress: document.getElementById('m-pickup').value,
                dropAddress: document.getElementById('m-drop').value,
                serviceType: document.getElementById('m-service').value,
                carType: document.getElementById('m-car').value
            };
            try {
                const res = await fetch('/api/bookings/manual', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert('Manual booking created successfully.');
                    closeManualModal();
                    document.querySelectorAll('#manual-modal input:not([type="date"])').forEach(i => i.value = '');
                    if (liveLoadedWidgetsDataset.length > 0) executeFilteredSearchPipeline();
                } else { alert('Failed to create manual booking.'); }
            } catch (err) { alert('Network error. Could not create booking.'); }
        }
    </script>
</body>

</html>
